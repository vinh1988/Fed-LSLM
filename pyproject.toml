[project]
name = "teacher-student"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.8.5",
    "gdown",
    "pillow>=12.2.0",
    "requests",
    "tqdm",
    "matplotlib",
    "seaborn",
    "torch",
    "torchvision",
    "transformers",
    "peft",
    "accelerate",
    "open-clip-torch",
    "faiss-cpu",
    "evaluate",
    "rouge-score",
    "nltk",
    "scikit-learn",
    "bert-score",
    "bitsandbytes",
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.75",
    "sentence-transformers>=5.6.0",
    "sentence_transformers",
    "google-genai>=2.10.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
